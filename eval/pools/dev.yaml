# Формулювання для dev-кейсів синтетики (eval/generate.py). test.yaml — ІНШІ формулювання:
# тюнінг словника й промпту на dev не бачить слів test (docs/SPEC.md §4).
# allergens: фрагмент складу, слово-алерген у **…** (як має бути виділено на етикетці).
# oov: true — форма поза словником/регулярками на момент B4a (out of vocabulary): міряє
# покриття, а не модель; правила на правді її не знайдуть — це очікувано (truth.meta.oov).
# Словник доповнюють лише dev-формами, test-формами — ніколи.

allergens:
  milk:
    - text: "сухе знежирене **молоко**"
    - text: "**вершки** 10 %"
    - text: "**сироватка молочна** суха"
    - text: "**масло вершкове**"
    - text: "**рікота**"
      oov: true
  cereals:
    - text: "борошно **пшеничне**"
    - text: "**вівсяні** пластівці"
    - text: "борошно **житнє** обдирне"
    - text: "**кус-кус**"
      oov: true
  eggs:
    - text: "**яєчний** порошок"
    - text: "**яйця** курячі"
    - text: "**меланж яєчний**"
  nuts:
    - text: "**фундук** смажений"
    - text: "**мигдаль**"
    - text: "**горіхи волоські**"
  soybeans:
    - text: "**соєвий** лецитин"
    - text: "**тофу**"
      oov: true
  sesame:
    - text: "насіння **кунжуту**"
  mustard:
    - text: "**гірчиця** столова"
    - text: "**гірчичний** порошок"
  fish:
    - text: "філе **оселедця**"
    - text: "**скумбрія** копчена"
  peanuts:
    - text: "**арахіс** смажений"
  celery:
    - text: "**селера** сушена"

# Не алергени, хоча схожі на них (пастки-виключення).
traps:
  - text: "кокосове молоко"
  - text: "мускатний горіх"
  - text: "кислота молочна"
  - text: "соняшникове молоко"
    oov: true

# Додані цукри для порушення «без доданого цукру».
sweeteners: ["мед", "сироп глюкозний", "інвертний сироп"]

# «Може містити»: {} — перелік; форми категорій (у словнику).
may_contain: "Може містити сліди {}."
may_contain_forms:
  milk: "молока"
  nuts: "горіхів"
  sesame: "кунжуту"
  eggs: "яєць"
  peanuts: "арахісу"
  soybeans: "сої"
  mustard: "гірчиці"
  celery: "селери"

claims:
  sugar_free: ["Без цукру", "Sugar free"]
  protein_source: ["Джерело білка"]
  fat_low: ["Низький вміст жиру"]
  no_added_sugar: ["Без доданого цукру"]
  fibre_source: ["Джерело клітковини"]

natural_sugars: "Містить природні цукри."

names:
  yogurt: ["Йогурт полуничний", "Йогурт персиковий"]
  cookies: ["Печиво «Ранкове»", "Печиво здобне"]
  bar: ["Батончик злаковий", "Батончик горіховий"]
  juice: ["Сік яблучний", "Нектар грушевий"]
  bread: ["Хліб житньо-пшеничний", "Батон нарізний"]
  sauce: ["Соус гірчичний", "Майонез «Столичний»"]
  kefir: ["Кефір 2,5 %", "Ряжанка 2,5 %"]
  spread: ["Паштет з оселедця", "Паста рибна"]
